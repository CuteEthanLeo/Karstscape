# Karstscape — THE single source of region and terrain numbers (SPEC §3.1).
#
# Everything under src/main/resources/data/karstscape/worldgen (and the world-preset tag / lang files)
# is GENERATED from this file plus the vanilla export by:
#
#     python tools/gen_worldgen.py           # regenerate
#     python tools/gen_worldgen.py --check   # fail if generated files are stale (used by the self-test)
#
# Climate values are the vanilla noise-router outputs that also pick biomes
# (temperature, humidity = router "vegetation", continentalness = "continents", erosion, weirdness = "ridges").
# A box bound at -1.0 / 1.0 means "open on that side" (extended to the climate limit ±2, no edge ramp).

# ------------------------------------------------------------------ world --
# karstscape:overworld dimension type, used by the default world (presets.overworld) and karst_only.
# karstscape:classic is the unchanged vanilla default world (comparison, benchmarks).
[world]
min_y = -64                # multiple of 16; kept vanilla so ores, deepslate, caves and ancient cities are unchanged
height = 512               # multiple of 16 -> build limit y 447 (vanilla 384 -> y 319)
cloud_height = 260.33     # vanilla 192.33; mountain tops rise through the clouds
# depth = (depth_zero_y - y) / depth_blocks + offset; the surface is where depth = 0 (vanilla 128 / 128)
depth_zero_y = 128
depth_blocks = 128
top_slide = [424, 446]     # terrain fades to air between these y (vanilla 240..256)
classic_en = "Classic (vanilla)"
classic_zh = "原版地形"

# ---------------------------------------------------------------- terrain --
# Large-scale shape of the whole Overworld (SPEC §10, M7), applied to copies of the vanilla functions in
# karstscape:terrain/. Karst regions and their plains are built on top of it.
[terrain]
# horizontal stretch of the vanilla climate noises (2.5 = features 2.5x as wide). Biomes follow: they are
# picked from the same values. Temperature and humidity keep the vanilla scale.
continents_stretch = 4.0     # land masses and oceans
erosion_stretch = 2.0        # flat vs mountainous areas
ridges_stretch = 2.0         # peaks / valleys / rivers (weirdness)
continents_bias = 0.08       # added to continentalness: more land (vanilla coast starts at -0.19..-0.11)
# offset spline: vanilla height above sea level (blocks; 128 x spline value) -> new height above sea.
# Piecewise linear, extrapolated with the end slopes; derivatives are scaled by the local slope.
# Vanilla spline values span about -38 .. +192 blocks (deep ocean floor ~y25, highest offset ~y255).
offset_curve = [[-40, -76], [0, 0], [16, 18], [64, 112], [128, 230], [192, 280]]
factor_scale = 1.0           # x vanilla factor (lower = stronger 3D noise, more overhangs)
jaggedness_scale = 1.0       # x vanilla jaggedness (jagged peak noise on mountain ridges)
sea_level = 63               # = noise settings sea level (cliffs and plateaus are measured from it)

# M8 features, applied in this order on top of the transformed offset (all heights in blocks):
[terrain.ranges]
# long mountain crests: ridged noise (1 - |n|)^2, only where the land is mountainous
crater_fix = true            # vanilla ridges fold makes ring mountains around a dip; keep the peak level instead
crest_ridges = true          # in mountains, weirdness follows the crests (peaks line up into ranges)
weirdness = [0.1, 0.7]       # |weirdness| between crests .. on a crest (vanilla peaks at 2/3, valleys at 0)
river_keep = 0.1             # |raw weirdness| below this keeps its value (rivers continue through mountains)
noise = "karstscape:ridgeline"
xz_scale = 1.0
height = 40                  # extra crest height above the range mean ...
mean = 0.33                  # ... minus mean * height in the valleys between crests
erosion = [-0.15, -0.45]     # mountain mask 0 -> 1 (vanilla mountains are erosion < -0.375)
continents = [-0.05, 0.1]    # inland only

[terrain.plateaus]
# terraced hill country: flat treads, steep risers (mesas / tablelands); never in mountains
noise = "karstscape:plateau"
xz_scale = 1.0
threshold = [0.2, 0.4]       # noise -> mask 0 .. 1
step = 20                    # blocks per terrace
base_y = 64
riser = 0.3                  # fraction of a step used by the riser
tread_rise = 0.05            # treads rise this fraction of a step (slight slope, not dead flat)
min_above_sea = 6            # terraces start this far above sea level (beaches and lowlands stay smooth)
factor = 8.0                 # terrain factor on plateaus (vanilla <= 6.3) (less 3D noise: flat treads, clean risers)

[terrain.cliffs]
# some coasts rise by `height` within `ramp` blocks of the shoreline (fading inland with continentalness)
noise = "karstscape:cliff"
xz_scale = 1.0
threshold = [-0.15, 0.1]     # about half of the coasts
continents = [0.12, -0.05]   # full at the coast, gone well inland
height = 28
ramp = 0.5                   # the rise happens within this height above sea of the original shore (steeper = smaller)

[terrain.rivers]
# every river (|ridges| ~ 0, the vanilla river biome is |ridges| < 0.05) is cut down to bed_y; through high
# land that makes a gorge. The channel rises from bed_y by `rise` blocks over `bank` (|ridges| units).
center = 0.015
bank = 0.12
bed_y = 58
rise = 320
power = 1.5                  # > 1: narrow at the bottom, widening upwards (V-shaped gorge)

# ----------------------------------------------------------------- noises --
# karstscape:<name> noise parameters (26.3 format, see reference/vanilla-26.3/data/minecraft/worldgen/noise/).
# Normalised: a value std of base_amplitude / 3. Frequency of the first octave is 2^base_octave per block.
[noises.ridgeline]
base_octave = -10
octave_count = 3
base_amplitude = 2.0
amplitude_modifiers = [1.0, 0.35, 0.12]

[noises.plateau]
base_octave = -10
octave_count = 2
base_amplitude = 1.0

[noises.cliff]
base_octave = -10
octave_count = 2
base_amplitude = 1.0

# ---------------------------------------------------------------- regions --
# The biome karstscape:tower_karst occupies exactly this box. The terrain mask is 1 inside the box minus
# `edge` on each closed side and ramps linearly to 0 at the box boundary, so the karst terrain fades out
# while still inside the karst biome (no towers in neighbouring biomes).

[presets.overworld]
# the default world type (replaces minecraft:normal): normal Overworld with karst regions (target: 5–10 % of land)
world_preset = "minecraft:normal"
# Tuned 2026-11-16 with `headless_test.py --profile tune --seed=…` (24 km squares, 3 seeds):
# 8.2–9.4 % of land, 9–14 regions >= 1 km2 each, largest 2.7–4.8 km2.
# Not constrained on humidity: vegetation is the highest-frequency climate noise and splits regions
# into many tiny patches (with humidity >= 0.1 only 2 regions >= 1 km2 per 24 km square).
temperature = [0.2, 0.55]        # the vanilla "warm" band (savanna/jungle latitudes), no deserts, no cold
humidity = [-1.0, 1.0]
continentalness = [0.18, 1.0]    # well inland (vanilla coast ends at 0.03)
erosion = [-0.2225, 1.0]         # medium .. high erosion = flatter vanilla terrain
weirdness = [-1.0, 1.0]
edge = 0.05                      # ramp width in climate units on every closed side

[presets.karst_only]
# debug / aerial preset: all land is karst
display_en = "Karst Only (debug)"
display_zh = "全峰林（调试）"
temperature = [-1.0, 1.0]
humidity = [-1.0, 1.0]
continentalness = [-0.19, 1.0]   # all land incl. the coast (no non-karst coastal strip for villages)
erosion = [-1.0, 1.0]
weirdness = [-1.0, 1.0]
edge = 0.05

# ------------------------------------------------------------------ plain --
# Inside the mask the vanilla terrain is cut down to an inter-tower plain: hills above the plain are lowered,
# valleys, rivers and lakes below it are kept (they become the M4 river valleys).
[plain]
cap_y = 74                 # plain top (block y) where the mask is 1
cap_noise_blocks = 4       # ± gentle undulation of the plain top
cap_noise = "minecraft:surface"
cap_noise_xz_scale = 1.0
min_factor = 6.0           # terrain "factor" floor inside the mask (higher = flatter, less 3D noise)

# ------------------------------------------------------------------ river --
# Vanilla rivers follow weirdness ("ridges") ~ 0. Inside the karst mask they become a wide, shallow,
# boatable channel and towers keep out of the corridor, so a river is never cut into dead-end ponds.
[river]
center = 0.03            # |ridges| below this: channel bed at bed_y (water = sea level 63)
bank = 0.05              # |ridges| from center to center+bank: bed rises to the plain (gentle banks)
bed_y = 58               # channel bed target y -> ~3 blocks of water (actual bed lands ~1 block higher)
tower_clear = 0.12       # no tower centres where |ridges| < tower_clear ...
tower_clear_ramp = 0.04  # ... full tower density from tower_clear + ramp

# ------------------------------------------------------------------ spawn --
[spawn]
# karstscape preset: the spawn search avoids the karst box (vanilla spawn ranges minus the box).
# karst_only: everything is karst, so spawn in the tower-free coastal strip of land.
karst_only_continentalness = [-0.19, -0.18]   # outermost coast: mask < 0.25 there, so no towers

# ------------------------------------------------------------- structures --
[structures]
# biome tags tower_karst is added to. Underground structures only: surface structures (villages, outposts,
# ruined portals, camps...) would sit on tower tops or have their footprint carved into tower walls.
allow = ["has_structure/mineshaft", "has_structure/stronghold", "has_structure/trial_chambers", "is_overworld"]

# ----------------------------------------------------------------- towers --
# karstscape:tower_field (Java density function). Combined as max(terrain, towers) outside the
# interpolated node, so walls are exact per block. Heights are above base_y (the plain is ~y68-78).
[towers]
cell_size = 58           # one candidate tower per cell -> mean spacing ~ cell size
probability = 0.93       # chance a cell has a tower where the mask is full
mask_min = 0.25          # no towers where the mask (at the tower centre) is below this ...
mask_full = 0.85         # ... full density/height from here on
base_y = 62
height_min = 52
height_max = 150
tall_chance = 0.06       # a few towers get up to +tall_extra
tall_extra = 24
radius_min = 7
radius_max = 31          # radius uniform in [min, max]
taper = 0.12             # fraction of the radius used by the wall slope (smaller = more vertical)
dome = 0.5               # dome height as a fraction of the top radius
wobble = 0.2            # radius perturbation (3 seeded harmonics)
twin_chance = 0.15       # a smaller attached second peak

# ------------------------------------------------------------------ biome --
[biome]
template = "plains"        # vanilla biome copied for features / spawns until M3
temperature = 0.8
downfall = 0.8
carvers = false          # no carver caves in towers (karst caves are a later feature, SPEC §7)
remove_features = [
  "minecraft:monster_room", "minecraft:lake_lava_surface", "minecraft:lake_lava_underground",  # hollow out towers
  # decorative stone/dirt blobs: they cut through the limestone bands as brown/grey patches on tower walls
  "minecraft:ore_dirt", "minecraft:ore_gravel", "minecraft:ore_granite_upper", "minecraft:ore_granite_lower",
  "minecraft:ore_diorite_upper", "minecraft:ore_diorite_lower", "minecraft:ore_andesite_upper",
  "minecraft:ore_andesite_lower", "minecraft:ore_tuff",
]
# light white-blue haze so distant towers separate into layers (environment attributes, 1.21.11+)
fog_color = "#d3e1ee"
sky_color = "#8fb5e6"
water_color = "#3d8fb0"
water_fog_color = "#2f6f86"

# --------------------------------------------------------------- material --
# Material (surface) rules for tower_karst, applied above the preliminary surface before the vanilla ones.
[material]
tower_y = 88             # blocks at/above this y in the karst biome are tower rock (plain tops out lower)
foot_y = 80              # steep floors from here up are tower feet: gravel / coarse dirt
band_seed = 74           # band pattern seed; 74 matches the weights within y92..200 (most of each tower)
band_min = 2
band_max = 7
band_top = 264
# weighted band blocks (limestone layers): stone dominates
bands = [["minecraft:stone", 50], ["minecraft:andesite", 14], ["minecraft:calcite", 16], ["minecraft:tuff", 12], ["minecraft:dripstone_block", 8]]
moss_noise = "minecraft:surface"
moss_wall_threshold = 0.55   # 2D noise above this -> moss streak down that column of the wall
moss_top_threshold = 0.2     # 2D noise above this on tower tops -> moss block instead of grass
riverbed_noise = "minecraft:surface"

# ------------------------------------------------------------- vegetation --
[vegetation]
vine_count = 1200        # vine placement attempts per chunk on tower walls (y 66..240); most attempts miss a wall
bamboo_rarity = 3        # 1 bamboo patch per N chunks
azalea_count = 2         # azalea trees per chunk (lands on plain and tower tops)
jungle_bush_count = 2
pond_rarity = 18         # small water ponds, 1 per N chunks
