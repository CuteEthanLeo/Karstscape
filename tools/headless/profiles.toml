# Profiles for tools/headless_test.py.
#
# Each profile starts the dev dedicated server (gradlew runHeadlessServer, run dir run-headless/)
# with a fixed seed and world preset, waits for "Done (", sends the console commands in order
# (each must print a line matching `expect` within `timeout` seconds), then sends `stop`.
#
#   seed        level-seed
#   level_type  world preset id (written escaped as minecraft\:normal)
#   level_name  world folder inside run-headless/ (one per profile so presets never mix)
#   baseline    name of tools/headless/baselines/<name>.warn.txt
#   collect     glob patterns (relative to run-headless/) copied into the result folder;
#               with --repeat N they are also compared across runs (determinism check)

[vanilla]
seed = "20260915"
level_type = "minecraft:normal"
level_name = "ks_vanilla"
baseline = "vanilla"
collect = []

[[vanilla.commands]]
send = "seed"
expect = 'Seed: \[{seed}\]'
timeout = 60

[[vanilla.commands]]
send = "save-all flush"
expect = 'Saved the game'
timeout = 300

[karstscape]
seed = "20260915"
level_type = "karstscape:karstscape"
level_name = "ks_karstscape"
baseline = "vanilla"
collect = ["karstscape_export/**/*.json", "karstscape_export/**/*.png"]

[[karstscape.commands]]
send = "seed"
expect = 'Seed: \[{seed}\]'
timeout = 60

[[karstscape.commands]]
send = "locate biome karstscape:tower_karst"
expect = 'The nearest karstscape:tower_karst is at|Could not find a biome'
timeout = 300

# large area, coarse: karst share of land
[[karstscape.commands]]
send = "karstscape export 12288 0 0 64"
expect = 'Karstscape export (done: \S*_r12288_s64\b|failed)'
timeout = 900

# medium area around spawn: shape of regions and edges
[[karstscape.commands]]
send = "karstscape export 3072 0 0 8"
expect = 'Karstscape export (done: \S*_r3072_s8\b|failed)'
timeout = 900

[karst_only]
seed = "20260915"
level_type = "karstscape:karst_only"
level_name = "ks_karst_only"
baseline = "vanilla"
collect = ["karstscape_export/**/*.json", "karstscape_export/**/*.png"]

[[karst_only.commands]]
send = "locate biome karstscape:tower_karst"
expect = 'The nearest karstscape:tower_karst is at|Could not find a biome'
timeout = 300

[[karst_only.commands]]
send = "karstscape export 2048 0 0 8"
expect = 'Karstscape export (done: \S*_r2048_s8\b|failed)'
timeout = 900

[tune]
seed = "20260915"
level_type = "karstscape:karstscape"
level_name = "ks_tune"
baseline = "vanilla"
collect = []

[[tune.commands]]
send = "karstscape export 12288 0 0 64"
expect = 'Karstscape export (done: \S*_r12288_s64\b|failed)'
timeout = 900
