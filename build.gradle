plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Minecraft 26.x and Loom need Java 25 for the Gradle JVM as well.
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
	throw new GradleException("Karstscape needs Java 25 to run Gradle (found ${JavaVersion.current()}). " +
			"Set JAVA_HOME to a JDK 25.")
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	// Minecraft 26.x is unobfuscated: no mappings line, plain `implementation`.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

loom {
	runs {
		// Dedicated server for tools/headless_test.py: separate run dir, pid file, no IDE config.
		headlessServer {
			server()
			displayName = "Headless Server"
			runDirectory = file("run-headless")
			programArguments.addAll("--pidFile", "server.pid")
			jvmArguments.add("-Xmx4G")
			generateRunConfig = false
		}
		// Client for tools/client_smoke.py: own run dir so its logs never mix with manual runClient/runServer.
		smokeClient {
			client()
			displayName = "Smoke Client"
			runDirectory = file("run-client-smoke")
			generateRunConfig = false
		}
	}
}
